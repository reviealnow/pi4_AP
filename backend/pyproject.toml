[project]
name = "pi4ap-backend"
version = "0.1.0"
description = "pi4_AP node backend — serial capture, raw logging, console WebSocket"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
